name: GameHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

# Every E2E group resets the same Neon database, so only one workflow may mutate it at a time.
concurrency:
  group: gamehub-shared-test-database
  cancel-in-progress: false

jobs:
  test:
    name: Type Check and E2E Tests
    runs-on: ubuntu-latest
    env:
      CI: true
      E2E: true
      PASSWORD: "123"
      JWT_SECRET: "local-admin-secret"
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || secrets.DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure test database
        run: printf 'DATABASE_URL="%s"\nTEST_DATABASE_URL="%s"\nCI=true\nE2E=true\n' "$DATABASE_URL" "$DATABASE_URL" > packages/db/.env

      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: pnpm playwright install chromium --with-deps

      - name: Push database schema
        run: pnpm --filter @repo/db exec prisma db push --accept-data-loss

      - name: Seed GameHub products
        run: pnpm --filter @repo/db db:seed

      - name: Type check
        run: pnpm turbo check-types

      - name: Build apps
        run: pnpm turbo build

      - name: Customer E2E tests
        id: test-1
        uses: education/autograding-command-grader@v1
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || secrets.DATABASE_URL }}
        with:
          test-name: Customer E2E tests
          command: pnpm turbo test-1
          timeout: 20
          max-score: 10

      - name: Admin E2E tests
        id: test-2
        uses: education/autograding-command-grader@v1
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || secrets.DATABASE_URL }}
        with:
          test-name: Admin E2E tests
          command: pnpm turbo test-2
          timeout: 20
          max-score: 10

      - name: Backend/API E2E tests
        id: test-3
        uses: education/autograding-command-grader@v1
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || secrets.DATABASE_URL }}
        with:
          test-name: Backend/API E2E tests
          command: pnpm turbo test-3
          timeout: 20
          max-score: 10

      - name: Autograding Reporter
        uses: education/autograding-grading-reporter@v1
        env:
          TEST-1_RESULTS: "${{ steps.test-1.outputs.result }}"
          TEST-2_RESULTS: "${{ steps.test-2.outputs.result }}"
          TEST-3_RESULTS: "${{ steps.test-3.outputs.result }}"
        with:
          runners: test-1,test-2,test-3
